<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Conquista – Prototipo</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{--bg:#fff;--fg:#1c1c1e;--card:#fff;--mut:#6b7280;--line:#e5e7eb;--acc:#16a34a}
@media (prefers-color-scheme:dark){:root{--bg:#111315;--fg:#f2f2f2;--card:#1c1f22;--mut:#9ca3af;--line:#2d3237}}
*{box-sizing:border-box}
html,body{height:100%;margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--fg)}
button{font:inherit;cursor:pointer;color:var(--fg)}
.mut{color:var(--mut)}
#login{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;background:var(--bg);z-index:2000}
.box{width:100%;max-width:360px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px}
.box h1{margin:0 0 4px;font-size:26px}
.box p{margin:0 0 16px;color:var(--mut);font-size:14px}
.tabs{display:flex;gap:6px;margin-bottom:14px}
.tabs button{flex:1;padding:8px;border:1px solid var(--line);background:none;border-radius:8px;font-size:14px}
.tabs button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
input{width:100%;padding:12px;margin-bottom:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg);font-size:16px}
.primary{width:100%;padding:12px;border:0;border-radius:10px;background:var(--acc);color:#fff;font-weight:600}
#err{color:#dc2626;font-size:13px;min-height:18px;margin-top:8px}
#app{position:fixed;inset:0;display:none}
#map{position:absolute;inset:0}
#top{position:absolute;top:0;left:0;right:0;z-index:1000;padding:calc(env(safe-area-inset-top,0px) + 8px) 8px 8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;pointer-events:none}
.chip{pointer-events:auto;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:7px 11px;font-size:14px;box-shadow:0 2px 8px #0003;display:flex;align-items:center;gap:6px;position:relative}
.chip b{max-width:84px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip small{color:var(--mut);font-size:11px}
.dot{width:12px;height:12px;border-radius:50%;display:inline-block;flex:none}
#badge,#sbadge{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;border-radius:9px;background:#dc2626;color:#fff;font-size:11px;font-style:normal;display:none;align-items:center;justify-content:center;padding:0 4px}
#bar{position:absolute;left:0;right:0;bottom:0;z-index:1000;background:var(--card);border-top:1px solid var(--line);padding:10px 10px calc(env(safe-area-inset-bottom,0px) + 10px);border-radius:16px 16px 0 0;box-shadow:0 -4px 16px #0003}
#status{font-size:13px;color:var(--mut);margin-bottom:8px;min-height:18px;text-align:center}
.row{display:flex;gap:8px}
.row button{flex:1;padding:12px 6px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-weight:600;font-size:14px}
.row button.go{background:var(--acc);color:#fff;border-color:var(--acc)}
.row button.stop{background:#dc2626;color:#fff;border-color:#dc2626}
#sheet{position:fixed;inset:0;z-index:1500;background:#0008;display:none;align-items:flex-end}
#sheet .in{width:100%;max-height:85%;overflow:auto;background:var(--card);border-radius:16px 16px 0 0;padding:16px 16px calc(env(safe-area-inset-bottom,0px) + 16px)}
#sheet h2{margin:0 0 8px;font-size:18px}
#sheet h3{margin:16px 0 6px;font-size:13px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
.rk{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.rk b{width:22px;text-align:center}.rk .n{flex:1;font-size:14px}.rk .s{color:var(--mut);font-size:12px;text-align:right;white-space:nowrap}
.menu button{display:block;width:100%;text-align:left;padding:12px;margin-bottom:8px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.menu small{display:block;color:var(--mut);font-weight:400;margin-top:2px}
.units{display:flex;gap:10px}.units label{flex:1;font-size:13px;color:var(--mut)}
.units select{width:100%;margin-top:4px;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg);font-size:15px}
.prof{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin:6px 0 4px}
.bar i{display:block;height:100%;background:var(--acc);border-radius:4px}
.kv{display:flex;gap:8px;margin-bottom:12px}
.kv div{flex:1;border:1px solid var(--line);border-radius:12px;padding:8px;text-align:center;font-size:20px}
.kv b{display:block;font-size:16px}.kv small{display:block;font-size:11px;color:var(--mut)}
.ptabs{display:flex;gap:6px;margin-bottom:10px}
.ptabs button{flex:1;padding:8px;border:1px solid var(--line);background:none;border-radius:8px;font-size:14px}
.ptabs button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.mi{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;font-size:14px}
.mi.done{border-color:var(--acc)}
.agrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ac{border:1px solid var(--line);border-radius:12px;padding:10px;opacity:.45;filter:grayscale(1);font-size:13px}
.ac.on{opacity:1;filter:none;border-color:var(--acc)}
.ac .i{font-size:26px}.ac b{display:block;margin-top:2px}.ac small{color:var(--mut)}
.rules p{margin:0 0 10px;font-size:14px;line-height:1.4}
.sbtn{padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-size:13px}
.ppl{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.ppl .n{flex:1;min-width:0;font-size:14px}
.ppl .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.ppl[data-a],.rk[data-a]{cursor:pointer}
.chatbox{height:40vh;overflow:auto;border:1px solid var(--line);border-radius:12px;padding:8px;margin:8px 0;display:flex;flex-direction:column;gap:6px}
.msg{max-width:82%;padding:7px 10px;border-radius:12px;background:var(--line);font-size:14px;align-self:flex-start;word-wrap:break-word}
.msg.me{align-self:flex-end;background:var(--acc);color:#fff}
.msg small{display:block;font-size:11px;opacity:.7}
.sendrow{display:flex;gap:6px;align-items:center}.sendrow input{margin:0;flex:1;min-width:0}.sendrow .primary{width:auto;padding:12px 16px}
.reacts{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;width:100%}
select.sel{padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg);font-size:16px}
.blabel{font-size:11px;font-weight:700;color:#111;text-shadow:0 0 3px #fff,0 0 3px #fff;white-space:nowrap;opacity:.7;pointer-events:none;text-align:center;text-transform:uppercase;letter-spacing:.05em}
.dotn{display:inline-block;min-width:18px;height:18px;line-height:18px;border-radius:9px;background:#dc2626;color:#fff;font-size:11px;text-align:center;padding:0 5px}
.shop{width:30px;height:30px;border-radius:50%;background:#fff;border:2px solid #f59e0b;display:flex;align-items:center;justify-content:center;font-size:16px;box-shadow:0 2px 6px #0004}
.sw{height:52px;border-radius:10px;margin-bottom:6px;border:1px solid var(--line)}
.item{border:1px solid var(--line);border-radius:12px;padding:8px;font-size:13px;text-align:center}
.item.on{border-color:var(--acc)}.item b{display:block;margin-bottom:4px}
.code{font-family:ui-monospace,Menlo,monospace;font-size:22px;letter-spacing:.2em;margin:6px 0;font-weight:700}
.flag{padding:8px 10px;border-radius:10px;margin-bottom:6px;font-size:13px;border:1px solid var(--line)}
.flag.reject{border-color:#dc2626;background:#dc262618}.flag.warn{border-color:#d97706;background:#d9770618}.flag.ok{border-color:var(--acc);background:#16a34a18}
#fx{position:fixed;inset:0;z-index:2500;pointer-events:none;display:none}
#banner{position:fixed;left:50%;top:38%;z-index:2600;transform:translate(-50%,-50%) scale(.6);opacity:0;pointer-events:none;text-align:center;background:var(--card);border:2px solid var(--acc);border-radius:20px;padding:18px 26px;box-shadow:0 10px 40px #0006;max-width:88%}
#banner.show{animation:pop 3.2s ease forwards}
#banner b{display:block;font-size:21px;margin-bottom:4px}#banner span{color:var(--mut);font-size:14px}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-50%) scale(.5)}12%{opacity:1;transform:translate(-50%,-50%) scale(1.08)}20%{transform:translate(-50%,-50%) scale(1)}85%{opacity:1}100%{opacity:0;transform:translate(-50%,-60%) scale(1)}}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 96px);transform:translateX(-50%);z-index:3000;background:#111;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;max-width:92%;display:none;text-align:center}
.me{width:16px;height:16px;border-radius:50%;background:#2563eb;border:3px solid #fff;box-shadow:0 0 0 3px #2563eb55}
.leaflet-container{font:inherit}
</style>
</head>
<body>

<div id="login">
  <div class="box">
    <h1>🗺️ Conquista</h1>
    <p>Caminá, encerrá zonas y quedate con la ciudad.</p>
    <div class="tabs">
      <button id="tabIn" class="on">Ingresar</button>
      <button id="tabUp">Crear usuario</button>
    </div>
    <input id="u" placeholder="Usuario (letras y números)" autocomplete="username" autocapitalize="none">
    <input id="p" type="password" placeholder="Contraseña" autocomplete="current-password">
    <button class="primary" id="go">Ingresar</button>
    <div id="err"></div>
  </div>
</div>

<div id="app">
  <div id="map"></div>
  <div id="top">
    <button class="chip" id="chipMe"><span class="dot" id="meDot"></span><b id="meName"></b><small id="meLvl"></small></button>
    <div class="chip" id="meScore">0 m²</div>
    <div class="chip" id="meStreak">🔥 0</div>
    <div style="flex:1"></div>
    <button class="chip" id="btnSoc">👥<i id="sbadge"></i></button>
    <button class="chip" id="btnNot">🔔<i id="badge"></i></button>
    <button class="chip" id="btnRank">🏆</button>
    <button class="chip" id="btnMenu">☰</button>
  </div>
  <div id="bar">
    <div id="status">Elegí cómo querés jugar</div>
    <div class="row" id="rowStart">
      <button class="go" id="btnGps">🚶 Caminar (GPS real)</button>
      <button id="btnSim">✏️ Dibujar (prueba)</button>
    </div>
    <div class="row" id="rowRec" style="display:none">
      <button id="btnClose" class="go">✔ Cerrar lazo</button>
      <button id="btnCancel" class="stop">✖ Cancelar</button>
    </div>
  </div>
</div>

<div id="sheet"><div class="in" id="sheetIn"></div></div>
<canvas id="fx"></canvas>
<div id="banner"><b id="bT"></b><span id="bS"></span></div>
<div id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
/* ============ CONFIG ============ */
const START_CENTER=[-27.487,-55.120];          // Oberá, Misiones (cambialo por tu ciudad)
const DLAT=0.000045;                            // celda ≈ 5 m (25 m²)
const REF_LAT=-27.5;
const DLNG=DLAT/Math.cos(REF_LAT*Math.PI/180);
const CELL_M2=(DLAT*111320)*(DLAT*111320);
const CLOSE_DIST=20, MAX_SPEED=5.6, MIN_STEP=3;
const COLORS=['#e11d48','#2563eb','#16a34a','#d97706','#7c3aed','#0891b2','#db2777','#65a30d'];
const HOUR=3600e3, DAY=864e5;
const SHIELD_BASE=2*HOUR;                       // escudo base de cada zona conquistada
const SHIELD_PER_STREAK=30*60e3;                // +30 min por día de racha (hasta 10 días)
const MAX_STR=5;                                // fuerza máxima de una zona
const XP_LEVEL=200;
// --- Privacidad ---
const PRIV_RADII=[100,200,300,500];             // radios posibles de la zona privada (m)
const PRIV_COOLDOWN=7*DAY;                      // la zona solo se puede cambiar 1 vez por semana
// --- Anti-trampas ---
const AC={MAX_AVG:3.3,WIN_S:45,WIN_AVG:4.2,TELE_M:150,TELE_S:10,MIN_PERFECT:12,MAX_LOOP_M2:1.5e6,DRIFT_MS:30000};
// --- Tienda de cosméticos (se pagan con monedas 🪙 ganadas jugando) ---
const SHOP=[
  {id:'c_coral',t:'color',n:'Coral',v:'#ff6b6b',p:50},{id:'c_cyan',t:'color',n:'Cian',v:'#00c8ff',p:50},
  {id:'c_lime',t:'color',n:'Lima',v:'#a3e635',p:50},{id:'c_pink',t:'color',n:'Rosa',v:'#ff4fd8',p:80},
  {id:'c_violet',t:'color',n:'Violeta',v:'#8b5cf6',p:80},{id:'c_obsid',t:'color',n:'Obsidiana',v:'#1f2937',p:100},
  {id:'c_gold',t:'color',n:'Oro',v:'#facc15',p:150},
  {id:'p_stripes',t:'pattern',n:'Rayas',v:'stripes',p:150},{id:'p_grid',t:'pattern',n:'Cuadrícula',v:'grid',p:150},
  {id:'p_dots',t:'pattern',n:'Puntos',v:'dots',p:200},
  {id:'e_glow',t:'effect',n:'Resplandor',v:'glow',p:250},{id:'e_neon',t:'effect',n:'Neón',v:'neon',p:400}
];
const PAT_BUDGET=5000;                          // tope de líneas/puntos de patrones por dibujo
// --- Comercios aliados (ejemplos: reemplazalos por tus comercios reales) ---
const COUPON_COOLDOWN=7*DAY, COUPON_VALID=7*DAY;
const SHOPS=(()=>{const [la,lo]=START_CENTER;return[
  {id:'cafe',n:'Café del Centro',e:'☕',c:[la+0.0010,lo+0.0008],offer:'10% de descuento en cualquier café',r:40},
  {id:'pan',n:'Panadería La Espiga',e:'🥐',c:[la-0.0012,lo+0.0015],offer:'2x1 en medialunas',r:40},
  {id:'helado',n:'Heladería Polar',e:'🍦',c:[la+0.0020,lo-0.0012],offer:'15% de descuento en helados',r:40},
  {id:'gym',n:'Gimnasio FitZone',e:'🏋️',c:[la-0.0020,lo-0.0014],offer:'Pase libre por un día',r:40},
  {id:'libro',n:'Librería Rayuela',e:'📚',c:[la+0.0004,lo-0.0025],offer:'5% de descuento en libros',r:40},
  {id:'jugo',n:'Jugos Vitamina',e:'🥤',c:[la-0.0006,lo+0.0030],offer:'Jugo natural gratis al comprar un sándwich',r:40}]})();
const MAX_TEAM=10;                              // miembros máximos por equipo
const TEAM_EMOJIS=['🦅','🐺','🦁','🐯','🔥','⚡','🌵','🐢','🦊','🚀'];
const REACTS=[{e:'😡',t:'¡Me las vas a pagar!'},{e:'🤡',t:'Qué susto… ni lo sentí'},{e:'😂',t:'Jaja, ni cosquillas'},{e:'😎',t:'La recupero mañana'},{e:'🔥',t:'Esto es guerra'}];
const BOT=['¡Jaja, ya vas a ver!','Esa zona era mía 😤','Te veo en el mapa… 👀','Buena jugada, pero mañana la recupero','¿Eso es todo lo que tenés? 😏'];
// BARRIOS: cada celda del mapa pertenece al barrio cuyo centro le queda más cerca.
// Por defecto se generan 9 sectores alrededor de START_CENTER. Reemplazalos por tus barrios reales:
// {n:'Nombre', c:[latitud, longitud del centro]}
const BARRIOS=(()=>{const [la,lo]=START_CENTER,d=0.008;return[
  {n:'Centro',c:[la,lo]},{n:'Norte',c:[la+d,lo]},{n:'Sur',c:[la-d,lo]},{n:'Este',c:[la,lo+d]},{n:'Oeste',c:[la,lo-d]},
  {n:'Noreste',c:[la+d,lo+d]},{n:'Noroeste',c:[la+d,lo-d]},{n:'Sudeste',c:[la-d,lo+d]},{n:'Sudoeste',c:[la-d,lo-d]}]})();

/* ============ ESTADO / "BACKEND" LOCAL ============ */
// En el prototipo todo vive en localStorage (solo este navegador).
// En la app real esto será Supabase/Firebase.
// celda = [dueño, conquistadaEn, refuerzos, desde, daño, escudoMs, díaRefuerzo]
const KEY='conquista_v3';
const DEF={users:{},cells:{},season:null,history:[],session:null,notifs:{},stats:{},ach:{},missions:{},teams:{},friends:{},chats:{},seen:{},steals:{},inv:{},coupons:{},visits:{}};
let DB=Object.assign({},DEF,JSON.parse(localStorage.getItem(KEY)||'{}'));
const PREF=Object.assign({area:'auto',dist:'auto'},JSON.parse(localStorage.getItem('conquista_pref')||'{}'));
const savePref=()=>localStorage.setItem('conquista_pref',JSON.stringify(PREF));
const save=()=>localStorage.setItem(KEY,JSON.stringify(DB));
if((DB.grid||1)<2){
  const N={};
  for(const k in DB.cells){
    const p=k.indexOf(':'),i=+k.slice(0,p),j=+k.slice(p+1);
    for(let a=0;a<2;a++)for(let b=0;b<2;b++)N[(2*i+a)+':'+(2*j+b)]=DB.cells[k].slice();
  }
  DB.cells=N;
  for(const k in DB.steals)DB.steals[k]*=4;
  DB.history.forEach(h=>h.cells*=4);
  for(const u in DB.notifs)DB.notifs[u].forEach(n=>{if(n.f)n.f*=4;if(n.h)n.h*=4;if(n.b)n.b*=4});
  for(const u in DB.stats){const t=DB.stats[u];t.cells*=4;t.stolen*=4;t.maxLoop*=4}
  DB.grid=2;save();
}
const $=id=>document.getElementById(id);
const seasonKey=()=>new Date().toISOString().slice(0,7);
const dayKey=(d=new Date())=>d.toLocaleDateString('en-CA');
function weekKey(d=new Date()){
  const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())),n=t.getUTCDay()||7;
  t.setUTCDate(t.getUTCDate()+4-n);
  const y0=new Date(Date.UTC(t.getUTCFullYear(),0,1));
  return t.getUTCFullYear()+'-W'+String(Math.ceil(((t-y0)/DAY+1)/7)).padStart(2,'0');
}
function checkSeason(){
  const s=seasonKey();
  if(DB.season&&DB.season!==s){
    const sc=scores();
    if(sc.length)DB.history.unshift({season:DB.season,winner:sc[0].name,cells:sc[0].n});
    DB.cells={};
  }
  DB.season=s;save();
}
function scores(){
  const c={};
  for(const k in DB.cells){const o=DB.cells[k][0];c[o]=(c[o]||0)+1}
  return Object.entries(c).map(([name,n])=>({name,n})).sort((a,b)=>b.n-a.n);
}
async function hash(s){
  try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('conq:'+s));
      return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
  catch(e){return btoa(unescape(encodeURIComponent(s)))}
}

/* ============ FORMATO / UNIDADES ============ */
const nf=(n,d)=>n.toLocaleString('es-AR',{minimumFractionDigits:d,maximumFractionDigits:d});
function fmtArea(m2){
  const u=PREF.area;
  if(u==='m2')return nf(m2,0)+' m²';
  if(u==='ha')return nf(m2/1e4,2)+' ha';
  if(u==='km2')return nf(m2/1e6,3)+' km²';
  if(u==='acre')return nf(m2/4046.856,2)+' acres';
  return m2>=1e6?nf(m2/1e6,2)+' km²':m2>=1e4?nf(m2/1e4,1)+' ha':nf(m2,0)+' m²';
}
function fmtDist(m){
  const u=PREF.dist;
  if(u==='m')return nf(m,0)+' m';
  if(u==='km')return nf(m/1000,2)+' km';
  if(u==='mi')return nf(m/1609.344,2)+' mi';
  return m>=1000?nf(m/1000,2)+' km':nf(m,0)+' m';
}
function fmtDur(ms){
  const m=Math.max(0,Math.round(ms/6e4));
  if(m<1)return 'instantes';if(m<60)return m+' min';
  const h=Math.floor(m/60);if(h<24)return h+' h'+(m%60?' '+(m%60)+' min':'');
  const d=Math.floor(h/24);return d+' d'+(h%24?' '+(h%24)+' h':'');
}
const fmtAgo=ts=>'hace '+fmtDur(Date.now()-ts);

/* ============ MECÁNICAS: fuerza, escudo, racha, nivel ============ */
const cellStr=c=>Math.max(1,Math.min(MAX_STR,1+(c[2]||0)+Math.floor((Date.now()-(c[3]||c[1]))/DAY))-(c[4]||0));
const shieldLeft=c=>c[1]+(c[5]||0)-Date.now();
function getStats(u){
  return DB.stats[u]=DB.stats[u]||{loops:0,dist:0,cells:0,stolen:0,maxLoop:0,night:0,best:0,streak:0,last:null,overtakes:0,leads:0,fort:0,xp:0};
}
function curStreak(st){
  const t=dayKey(),y=dayKey(new Date(Date.now()-DAY));
  return (st.last===t||st.last===y)?st.streak:0;
}
function updStreak(st){
  const t=dayKey(),y=dayKey(new Date(Date.now()-DAY));
  if(st.last===t)return false;
  st.streak=(st.last===y)?st.streak+1:1;st.last=t;st.best=Math.max(st.best,st.streak);st.xp+=5;
  return true;
}
const shieldFor=u=>SHIELD_BASE+Math.min(curStreak(getStats(u)),10)*SHIELD_PER_STREAK;

function isLight(hex){const n=parseInt(hex.slice(1),16),r=n>>16,g=(n>>8)&255,b=n&255;return .299*r+.587*g+.114*b>170}
function patternOverlay(kind,la0,la1,lo0,lo1,col){
  const light=isLight(col),st={renderer,color:light?'#000':'#fff',weight:1,opacity:light?.3:.55,interactive:false};
  if(kind==='dots'){
    for(let la=la0+2*DLAT;la<la1&&patBudget>0;la+=4*DLAT)

    return;
  }
  const sp=kind==='grid'?4:3;
  for(let la=la0+sp*DLAT/2;la<la1&&patBudget>0;la+=sp*DLAT){patBudget--;L.polyline([[la,lo0],[la,lo1]],st).addTo(cellLayer)}
  if(kind==='grid')for(let lo=lo0+sp*DLNG/2;lo<lo1&&patBudget>0;lo+=sp*DLNG){patBudget--;L.polyline([[la0,lo],[la1,lo]],st).addTo(cellLayer)}

function draw(){
  cellLayer.clearLayers();
  const t=Date.now(),rows={};
  for(const k in DB.cells){
    const c=DB.cells[k];
    if(!visibleTo(c))continue;                 // privacidad: publicación con retraso
    const p=k.indexOf(':'),i=+k.slice(0,p),j=+k.slice(p+1);
    const key=c[0]+'|'+cellStr(c)+'|'+(c[1]+(c[5]||0)>t?1:0)+'|'+i;
    (rows[key]=rows[key]||[]).push(j);
  }
  // 1) tramos horizontales  2) se unen verticalmente los tramos idénticos de filas consecutivas
  const blocks={};
  for(const key in rows){
    const q=key.lastIndexOf('|'),base=key.slice(0,q),i=+key.slice(q+1),js=rows[key].sort((x,y)=>x-y);
    let a=js[0],p=a;
    const add=()=>{const k2=base+'|'+a+'|'+p;(blocks[k2]=blocks[k2]||[]).push(i)};
    for(let n=1;n<js.length;n++){if(js[n]===p+1){p=js[n]}else{add();a=p=js[n]}}
    add();
  }
  patBudget=PAT_BUDGET;
  const sk={};
  for(const k2 in blocks){
    const [o,ss,sh,as,ps]=k2.split('|'),a=+as,p=+ps,str=+ss,is=blocks[k2].sort((x,y)=>x-y);
    const col=colorOf(o),shd=sh==='1';
    const S=sk[o]=sk[o]||{fx:skinItem(o,'effect'),pt:skinItem(o,'pattern')};
    const neon=S.fx&&S.fx.v==='neon'&&!shd,fo=Math.min(.85,.25+.12*str);
    const style={renderer,color:shd||neon?'#fff':col,weight:shd?1.2:(neon?1.5:.6),opacity:shd||neon?.85:fo,dashArray:null,fillColor:col,fillOpacity:fo,interactive:false};
    let i0=is[0],i1=i0;
    const flush=()=>{
      const bd=[[i0*DLAT,a*DLNG],[(i1+1)*DLAT,(p+1)*DLNG]];
      if(S.fx)L.rectangle(bd,{renderer,color:col,weight:S.fx.v==='neon'?10:7,opacity:.22,fill:false,interactive:false}).addTo(cellLayer);
      L.rectangle(bd,style).addTo(cellLayer);
      if(S.pt&&patBudget>0)patternOverlay(S.pt.v,bd[0][0],bd[1][0],bd[0][1],bd[1][1],col);
    };
    for(let n=1;n<is.length;n++){if(is[n]===i1+1){i1=is[n]}else{flush();i0=i1=is[n]}}
    flush();
  }
  refreshTop();
}

function dist(a,b){
  const R=6371000,r=Math.PI/180,dLa=(b[0]-a[0])*r,dLo=(b[1]-a[1])*r;
  const x=Math.sin(dLa/2)**2+Math.cos(a[0]*r)*Math.cos(b[0]*r)*Math.sin(dLo/2)**2;
  return 2*R*Math.asin(Math.sqrt(x));
}
function pathLen(p){let s=0;for(let i=1;i<p.length;i++)s+=dist(p[i-1],p[i]);return s}
function addPoint(lat,lng,t,acc,drift){
  const pts=rec.pts,p=[lat,lng,t,acc,drift],col=colorOf(DB.session);
  if(!pts.length){
    pts.push(p);
    startMarker=L.circleMarker([lat,lng],{radius:9,color:'#fff',weight:3,fillColor:col,fillOpacity:1}).addTo(map);
    pathLine=L.polyline([[lat,lng]],{color:col,weight:4}).addTo(map);
    return true;
  }
  const last=pts[pts.length-1],d=dist(last,p);
  if(rec.type==='gps'){
    if(d<MIN_STEP)return false;
    const dt=(t-last[2])/1000;
    if(dt>0&&d/dt>MAX_SPEED){rec.bad++;toast('⚠️ Vas muy rápido ('+(d/dt*3.6).toFixed(0)+' km/h). Ese tramo no cuenta.');return false}
    // velocidad sostenida (ventana): bici / moto / auto
    let k=pts.length-1;while(k>0&&(t-pts[k][2])/1000<AC.WIN_S)k--;
    const w=(t-pts[k][2])/1000;
    if(w>=AC.WIN_S*.6&&dist(pts[k],p)/w>AC.WIN_AVG){rec.bad++;toast('🚗 Parece que vas en vehículo: no se registran puntos');return false}
  }
  pts.push(p);pathLine.addLatLng([lat,lng]);
  if(pts.length>=4&&pathLen(pts)>=90&&dist(pts[0],p)<=CLOSE_DIST){finishLoop();return true}
  setStatus('Recorrido: '+fmtDist(pathLen(pts))+' · '+pts.length+' puntos');
  return true;
}
function onGps(pos){
  if(!rec||rec.type!=='gps')return;
  const c=pos.coords;
  if(c.accuracy>50){setStatus('Señal débil (±'+Math.round(c.accuracy)+' m)…');return}
  const ll=[c.latitude,c.longitude];
  if(!meMarker)meMarker=L.marker(ll,{icon:L.divIcon({className:'',html:'<div class="me"></div>',iconSize:[16,16]})}).addTo(map);
  else meMarker.setLatLng(ll);
  if(!rec.pts.length)map.setView(ll,18);
  if(addPoint(ll[0],ll[1],pos.timestamp||Date.now(),c.accuracy,(pos.timestamp||Date.now())-Date.now()))map.panTo(ll,{animate:true});
}

/* ============ CAPTURA DE TERRITORIO ============ */
function inPoly(x,y,poly){
  let c=false;
  for(let i=0,j=poly.length-1;i<poly.length;j=i++){
    const yi=poly[i][0],xi=poly[i][1],yj=poly[j][0],xj=poly[j][1];
    if((yi>y)!==(yj>y)&&x<(xj-xi)*(y-yi)/(yj-yi)+xi)c=!c;
  }
  return c;
}
/* Reglas por celda dentro del lazo:
   - libre            → es tuya (con escudo)
   - tuya             → refuerzo +1 de fuerza (1 vez por día)
   - ajena con escudo → bloqueada
   - ajena fuerte     → pierde 1 de fuerza (daño)
   - ajena fuerza 1   → cambia de dueño                                  */
function capture(poly,owner,opt={}){
  let minLa=1e9,maxLa=-1e9,minLo=1e9,maxLo=-1e9;
  poly.forEach(p=>{minLa=Math.min(minLa,p[0]);maxLa=Math.max(maxLa,p[0]);minLo=Math.min(minLo,p[1]);maxLo=Math.max(maxLo,p[1])});
  const R={inside:0,fresh:0,flipped:0,stolen:{},hits:0,blocked:0,reinforced:0,maxStr:0,ally:0,priv:0},V={};
  const t=Date.now(),today=Math.floor(t/DAY),sh=opt.noShield?0:shieldFor(owner),Z=privZones();
  const vic=n=>V[n]=V[n]||{f:0,h:0,b:0};
  for(let i=Math.floor(minLa/DLAT);i<=Math.floor(maxLa/DLAT);i++)
    for(let j=Math.floor(minLo/DLNG);j<=Math.floor(maxLo/DLNG);j++){
      if(!inPoly((j+.5)*DLNG,(i+.5)*DLAT,poly))continue;
      if(Z.length&&inPrivZone(i,j,Z)){R.priv++;continue}
      R.inside++;
      const k=i+':'+j,cur=DB.cells[k];
      if(!cur){DB.cells[k]=[owner,t,0,t,0,sh,0];R.fresh++;continue}
      if(cur[0]===owner){
        if(cur[6]!==today){cur[2]=Math.min((cur[2]||0)+1,MAX_STR-1);cur[4]=0;cur[6]=today;R.reinforced++}
        R.maxStr=Math.max(R.maxStr,cellStr(cur));
        continue;
      }
      if(sameTeam(owner,cur[0])){R.ally++;continue}
      if(shieldLeft(cur)>0){R.blocked++;vic(cur[0]).b++;continue}
      if(cellStr(cur)>1){cur[4]=(cur[4]||0)+1;R.hits++;vic(cur[0]).h++;continue}
      R.stolen[cur[0]]=(R.stolen[cur[0]]||0)+1;vic(cur[0]).f++;DB.steals[owner+'>'+cur[0]]=(DB.steals[owner+'>'+cur[0]]||0)+1;
      DB.cells[k]=[owner,t,0,t,0,sh,0];R.flipped++;
    }
  for(const v in V)notify(v,{type:'attack',by:owner,f:V[v].f,h:V[v].h,b:V[v].b});
  save();
  return R;
}
function finishLoop(){
  if(!rec)return;
  const pts=rec.pts.map(p=>[p[0],p[1]]);
  if(pts.length<3){toast('Necesitás al menos 3 puntos para encerrar un área');return}
  const walked=pathLen(rec.pts),st=getStats(DB.session);
  let clean=false;
  if(rec.type==='gps'){
    const A=analyzeTrack(rec.pts,{bad:rec.bad||0});A.label='Resultado de tu último lazo';
    if(!judge(A,st))return;
    clean=A.clean;
  }
  const newDay=updStreak(st);                 // la racha cuenta antes de calcular el escudo
  const before=scores(),lvl0=lvl(st.xp),tb=teamScores(),lb=leadersOf(DB.session);
  const R=capture(pts,DB.session);
  stopAll();
  if(!R.inside){draw();toast(R.priv?'🔒 Esa zona está restringida: no se puede conquistar':'El lazo es muy chico: no encerró ninguna celda');return}
  const parts=[],gain=R.fresh+R.flipped,sn=Object.entries(R.stolen);
  if(gain)parts.push('🎉 +'+fmtArea(gain*CELL_M2));
  if(sn.length)parts.push('Robaste '+sn.map(([n,c])=>fmtArea(c*CELL_M2)+' a '+n).join(', '));
  if(R.hits)parts.push('⚔️ '+fmtArea(R.hits*CELL_M2)+' dañado (defensa fuerte)');
  if(R.blocked)parts.push('🛡 '+fmtArea(R.blocked*CELL_M2)+' protegido por escudo');
  if(R.reinforced)parts.push('💪 más fuerza en '+fmtArea(R.reinforced*CELL_M2));
  if(R.priv)parts.push('🔒 '+fmtArea(R.priv*CELL_M2)+' en zona restringida (no cuenta)');
  if(R.ally)parts.push('🤝 '+fmtArea(R.ally*CELL_M2)+' son de tu equipo (no se roban)');
  if(!parts.length)parts.push('Ese territorio ya es tuyo y ya lo reforzaste hoy');
  toast(parts.join(' · '),7000);
  // ranking
  const ov=overtakeInfo(before);
  if(ov.lead)queueCel('👑 ¡Sos el nuevo líder!','Tenés el territorio más grande del mes',true);
  else if(ov.over.length)queueCel('🎉 ¡Superaste a '+ov.over.join(' y ')+'!','Subiste al puesto #'+ov.rank+' del ranking',true);
  const tOv=teamOvertake(tb);
  if(tOv.length)queueCel('🛡 ¡Tu equipo superó a '+tOv.join(' y ')+'!','Sigan sumando zonas entre todos',true);
  const nk=leadersOf(DB.session).filter(x=>!lb.includes(x));
  if(nk.length)queueCel('🏘️ ¡Sos el rey de '+nk.join(' y ')+'!','Nadie tiene más territorio que vos en el barrio',false);
  // progreso: stats, racha, misiones, logros, nivel
  const h=new Date().getHours(),night=h>=20||h<6;
  st.loops++;st.dist+=walked;st.cells+=gain;st.stolen+=R.flipped;st.maxLoop=Math.max(st.maxLoop,R.inside);
  if(night)st.night++;
  if(clean)st.trust=Math.min(100,trustOf(st)+2);
  if(R.maxStr>=MAX_STR)st.fort++;
  if(ov.over.length)st.overtakes++;
  if(ov.lead)st.leads++;
  st.xp+=10+(R.flipped?10:0);st.coins=(st.coins||0)+5+Math.min(20,Math.floor(gain*CELL_M2/500));
  if(newDay&&[3,7,14,30].includes(st.streak))st.coins=(st.coins||0)+40;
  if(newDay&&[3,7,14,30].includes(st.streak))queueCel('🔥 ¡Racha de '+st.streak+' días!','Tus escudos ahora duran '+fmtDur(shieldFor(DB.session)),false);
  grantCoupons(pts);
  updMissions(R,walked,night);
  checkAch();
  if(lvl(st.xp)>lvl0){st.coins=(st.coins||0)+25;queueCel('⭐ ¡Subiste al nivel '+lvl(st.xp)+'!','Seguí caminando · +25 🪙',false)}
  save();draw();
}
function overtakeInfo(before){
  const me=DB.session,after=scores(),N=l=>(l.find(x=>x.name===me)||{n:0}).n,bm=N(before),am=N(after);
  const over=before.filter(x=>x.name!==me&&x.n>bm&&((after.find(y=>y.name===x.name)||{n:0}).n<am)).map(x=>x.name);
  const lead=after.length>0&&after[0].name===me&&!(before.length&&before[0].name===me);
  return {over,lead,rank:after.findIndex(x=>x.name===me)+1};
}

const celQ=[];let celBusy=false;
function queueCel(t,s,big){celQ.push([t,s,big]);if(!celBusy)setTimeout(nextCel,600)}
function nextCel(){const x=celQ.shift();if(!x){celBusy=false;return}celBusy=true;celebrate(x[0],x[1],x[2]);setTimeout(nextCel,3300)}
function celebrate(title,sub,big){
  $('bT').textContent=title;$('bS').textContent=sub||'';
  const b=$('banner');b.classList.remove('show');void b.offsetWidth;b.classList.add('show');
  navigator.vibrate&&navigator.vibrate([80,60,80,60,160]);
  try{
    const ac=new(window.AudioContext||window.webkitAudioContext)();
    [523,659,784,1047].forEach((f,i)=>{const o=ac.createOscillator(),g=ac.createGain();o.type='triangle';o.frequency.value=f;
      g.gain.setValueAtTime(0,ac.currentTime+i*.12);g.gain.linearRampToValueAtTime(.18,ac.currentTime+i*.12+.02);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+i*.12+.35);
      o.connect(g).connect(ac.destination);o.start(ac.currentTime+i*.12);o.stop(ac.currentTime+i*.12+.4)});
  }catch(e){}
  confetti(big?220:90);
}
function confetti(n){
  const cv=$('fx'),cx=cv.getContext('2d');cv.width=innerWidth;cv.height=innerHeight;cv.style.display='block';
  const cols=['#e11d48','#2563eb','#16a34a','#f59e0b','#7c3aed','#06b6d4'];
  const ps=Array.from({length:n},()=>({x:innerWidth/2+(Math.random()-.5)*80,y:innerHeight*.4,vx:(Math.random()-.5)*14,vy:-Math.random()*13-4,r:Math.random()*6+3,c:cols[Math.random()*cols.length|0],a:Math.random()*6,va:(Math.random()-.5)*.4}));
  const t0=performance.now();
  (function f(t){
    const e=t-t0;cx.clearRect(0,0,cv.width,cv.height);
    ps.forEach(p=>{p.vy+=.35;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.a+=p.va;
      cx.save();cx.translate(p.x,p.y);cx.rotate(p.a);cx.globalAlpha=Math.max(0,1-e/3000);cx.fillStyle=p.c;cx.fillRect(-p.r,-p.r/2,p.r*2,p.r);cx.restore()});
    if(e<3000)requestAnimationFrame(f);else{cx.clearRect(0,0,cv.width,cv.height);cv.style.display='none'}
  })(t0);
}

const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const teamOf=u=>(DB.users[u]||{}).team||null;
const sameTeam=(a,b)=>{const t=teamOf(a);return !!t&&t===teamOf(b)};
const tagOf=u=>{const t=teamOf(u);return t&&DB.teams[t]?DB.teams[t].emoji+' ':''};
const colorOf=u=>{const it=skinItem(u,'color');return it?it.v:((DB.users[u]||{}).color||'#888')};

function scoreMap(){const c={};for(const k in DB.cells){const o=DB.cells[k][0];c[o]=(c[o]||0)+1}return c}
function teamScores(){
  const c={};for(const k in DB.cells){const t=teamOf(DB.cells[k][0]);if(t)c[t]=(c[t]||0)+1}
  return Object.entries(c).map(([name,n])=>({name,n})).sort((a,b)=>b.n-a.n);
}
function teamOvertake(before){
  const mt=teamOf(DB.session);if(!mt)return [];
  const after=teamScores(),N=l=>(l.find(x=>x.name===mt)||{n:0}).n,bm=N(before),am=N(after);
  return before.filter(x=>x.name!==mt&&x.n>bm&&((after.find(y=>y.name===x.name)||{n:0}).n<am)).map(x=>x.name);
}

/* --- Barrios --- */
const BC={};
function barrioOf(i,j){
  const k=i+':'+j;if(BC[k]!==undefined)return BC[k];
  const la=(i+.5)*DLAT,lo=(j+.5)*DLNG,cs=Math.cos(REF_LAT*Math.PI/180);
  let b=0,bd=1e9;
  BARRIOS.forEach((x,n)=>{const d=(x.c[0]-la)**2+((x.c[1]-lo)*cs)**2;if(d<bd){bd=d;b=n}});
  return BC[k]=b;
}
function barrioStats(){
  const S=BARRIOS.map(b=>({n:b.n,c:b.c,tot:{},sum:0,leader:null,rank:[]}));
  for(const k in DB.cells){
    const p=k.indexOf(':'),s=S[barrioOf(+k.slice(0,p),+k.slice(p+1))],o=DB.cells[k][0];
    s.tot[o]=(s.tot[o]||0)+1;s.sum++;
  }
  S.forEach(s=>{s.rank=Object.entries(s.tot).sort((a,b)=>b[1]-a[1]);s.leader=s.rank.length?s.rank[0][0]:null});
  return S;
}
const leadersOf=u=>barrioStats().filter(s=>s.leader===u).map(s=>s.n);
let barrioLayer;
function drawBarrios(){
  if(!map)return;
  if(!barrioLayer)barrioLayer=L.layerGroup();
  barrioLayer.clearLayers();
  if(PREF.barrios===false){map.removeLayer(barrioLayer);return}
  barrioLayer.addTo(map);
  BARRIOS.forEach(b=>L.marker(b.c,{interactive:false,icon:L.divIcon({className:'',html:'<div class="blabel">'+esc(b.n)+'</div>',iconSize:[90,16],iconAnchor:[45,8]})}).addTo(barrioLayer));
}
function showBarrioMap(i){closeSheet();map.setView(BARRIOS[i].c,16);toast('📍 Barrio '+BARRIOS[i].n)}

/* --- Ver zonas de un jugador --- */
function showPlayer(name){
  let a=1e9,b=-1e9,c=1e9,d=-1e9,n=0;
  for(const k in DB.cells){
    if(DB.cells[k][0]!==name||!visibleTo(DB.cells[k]))continue;
    const p=k.indexOf(':'),i=+k.slice(0,p),j=+k.slice(p+1);
    a=Math.min(a,i);b=Math.max(b,i);c=Math.min(c,j);d=Math.max(d,j);n++;
  }
  closeSheet();
  if(!n)return toast(name+' todavía no tiene zonas');
  const bounds=[[a*DLAT,c*DLNG],[(b+1)*DLAT,(d+1)*DLNG]];
  map.fitBounds(bounds,{maxZoom:17,padding:[50,50]});
  const hl=L.rectangle(bounds,{color:colorOf(name),weight:3,dashArray:'6 6',fill:false,interactive:false}).addTo(map);
  setTimeout(()=>map.removeLayer(hl),5000);
  toast('📍 Zonas de '+name+': '+fmtArea(n*CELL_M2));
}

function createTeam(name,emoji){

  if(!/^[A-Za-z0-9 _-]{3,16}$/.test(name))return toast('Nombre del equipo: 3 a 16 caracteres (letras, números, espacios, _ -)');
  if(Object.keys(DB.teams).some(t=>t.toLowerCase()===name.toLowerCase()))return toast('Ya existe un equipo con ese nombre');

function joinTeam(t){
  const me=DB.session,T=DB.teams[t];

/* ============ PRIVACIDAD ============ */
let pickMode=null,privLayer,shopLayer;
const privZones=()=>Object.values(DB.users).filter(u=>u.priv).map(u=>u.priv);
function inPrivZone(i,j,Z){
  const la=(i+.5)*DLAT,lo=(j+.5)*DLNG,cs=Math.cos(la*Math.PI/180);
  for(const z of Z){const dy=(la-z.lat)*111320,dx=(lo-z.lng)*111320*cs;if(dx*dx+dy*dy<=z.r*z.r)return true}
  return false;
}
const delayMs=u=>((DB.users[u]||{}).delay||0)*60000;
function visibleTo(c){const me=DB.session,o=c[0];return o===me||sameTeam(me,o)||Date.now()-c[1]>=delayMs(o)}
function setPrivZone(lat,lng,r){
  const me=DB.session,u=DB.users[me];
  if(u.privAt&&Date.now()-u.privAt<PRIV_COOLDOWN)return toast('Podés cambiar tu zona privada una vez por semana (faltan '+fmtDur(PRIV_COOLDOWN-(Date.now()-u.privAt))+')',6000);
  // el punto exacto NO se guarda: el centro se desplaza al azar hasta el 30% del radio
  const ang=Math.random()*2*Math.PI,off=Math.random()*.3*r;
  const la=lat+off*Math.sin(ang)/111320,lo=lng+off*Math.cos(ang)/(111320*Math.cos(lat*Math.PI/180));
  u.priv={lat:la,lng:lo,r,setAt:Date.now()};u.privAt=Date.now();
  let n=0;
  for(const k in DB.cells){
    if(DB.cells[k][0]!==me)continue;
    const p=k.indexOf(':');
    if(inPrivZone(+k.slice(0,p),+k.slice(p+1),[u.priv])){delete DB.cells[k];n++}
  }
  afterSocial();draw();drawPrivacy();

/* ============ ANTI-TRAMPAS ============ */
const trustOf=st=>st.trust==null?100:st.trust;
function polyAreaM2(pts){
  if(pts.length<3)return 0;
  const la0=pts[0][0],lo0=pts[0][1],cs=Math.cos(la0*Math.PI/180);let s=0;
  for(let i=0,j=pts.length-1;i<pts.length;j=i++){
    const xi=(pts[i][1]-lo0)*111320*cs,yi=(pts[i][0]-la0)*111320,xj=(pts[j][1]-lo0)*111320*cs,yj=(pts[j][0]-la0)*111320;
    s+=xj*yi-xi*yj;
  }
  return Math.abs(s)/2;
}
function cvar(a){
  if(a.length<2)return 1;
  const m=a.reduce((x,y)=>x+y,0)/a.length;if(!m)return 1;
  return Math.sqrt(a.reduce((x,y)=>x+(y-m)**2,0)/a.length)/Math.abs(m);
}
// pts: [lat,lng,tiempo_ms,precision?,desfase_reloj_ms?]
function analyzeTrack(pts,opt={}){
  const F=[],n=pts.length,steps=[],dts=[],cum=[0];
  let dsum=0,maxSeg=0,tele=0;
  for(let i=1;i<n;i++){
    const d=dist(pts[i-1],pts[i]),dt=(pts[i][2]-pts[i-1][2])/1000;
    dsum+=d;cum.push(dsum);steps.push(d);dts.push(dt);
    if(dt>0)maxSeg=Math.max(maxSeg,d/dt);
    if(d>=AC.TELE_M&&dt<AC.TELE_S)tele++;
  }
  const dur=n>1?(pts[n-1][2]-pts[0][2])/1000:0,avg=dur>0?dsum/dur:0;
  let wmax=0;
  for(let i=0,j=0;i<n;i++){
    if(j<i)j=i;
    while(j<n-1&&(pts[j][2]-pts[i][2])/1000<AC.WIN_S)j++;
    const w=(pts[j][2]-pts[i][2])/1000;
    if(w>=AC.WIN_S*.6)wmax=Math.max(wmax,(cum[j]-cum[i])/w);
  }
  const kmh=v=>nf(v*3.6,1)+' km/h';
  if(tele)F.push({code:'teleport',sev:'reject',msg:'Saltos de ubicación imposibles (más de '+AC.TELE_M+' m en menos de '+AC.TELE_S+' s)'});
  if(n>3&&dur<=0)F.push({code:'time',sev:'reject',msg:'Todas las posiciones tienen la misma hora'});
  if((opt.bad||0)>=5)F.push({code:'speed',sev:'reject',msg:'Muchos tramos a velocidad imposible para una caminata'});
  else if((opt.bad||0)>=2)F.push({code:'speed',sev:'warn',msg:'Algunos tramos a velocidad imposible fueron ignorados'});
  if(avg>AC.MAX_AVG)F.push({code:'vehicle',sev:'reject',msg:'Velocidad media de '+kmh(avg)+': parece bici, moto o auto'});
  else if(wmax>AC.WIN_AVG)F.push({code:'vehicle',sev:'reject',msg:'Tramo sostenido a '+kmh(wmax)+': parece un vehículo'});
  if(n>=AC.MIN_PERFECT&&cvar(steps)<.04&&cvar(dts)<.04)F.push({code:'fake',sev:'reject',msg:'Ruta demasiado perfecta: pasos y tiempos idénticos (posible GPS simulado)'});
  const accs=pts.map(p=>p[3]).filter(a=>a!=null);
  if(accs.length>=10&&new Set(accs.map(a=>Math.round(a*10))).size===1)F.push({code:'accuracy',sev:'warn',msg:'La precisión del GPS nunca varía (sospechoso)'});
  const drift=Math.max(0,...pts.map(p=>Math.abs(p[4]||0)));
  if(drift>AC.DRIFT_MS)F.push({code:'clock',sev:'warn',msg:'La hora del GPS no coincide con la del teléfono'});
  if(polyAreaM2(pts)>AC.MAX_LOOP_M2)F.push({code:'bigloop',sev:'reject',msg:'El lazo es demasiado grande para una caminata'});
  const reject=F.some(f=>f.sev==='reject'),warn=!reject&&F.length>0;
  return {reject,warn,clean:F.length===0,flags:F,stats:{dist:dsum,dur,avg,max:maxSeg,n}};
}
function judge(A,st){
  if(A.clean)return true;
  st.trust=Math.max(0,trustOf(st)-(A.reject?15:5));
  if(st.trust<40){st.lockUntil=Date.now()+DAY;st.trust=60}
  save();refreshTop();
  if(A.reject){stopAll();openFair(A);return false}
  toast('⚠️ Señales sospechosas: '+A.flags[0].msg,6000);
  return true;
}
const SCEN=[['walk','🚶 Caminata normal (5 km/h)'],['run','🏃 Trote (10 km/h)'],['bike','🚲 Bicicleta (22 km/h)'],['car','🚗 Auto (50 km/h)'],['tele','📡 Teletransporte (salto de 2 km)'],['fake','🤖 GPS simulado (ruta perfecta)']];
function genTrack(kind){
  const R=80,N=44,la=START_CENTER[0],lo=START_CENTER[1],cs=Math.cos(la*Math.PI/180);
  const v={walk:1.4,run:2.8,bike:6,car:14,fake:1.4,tele:1.4}[kind]||1.4,fake=kind==='fake',base=2*Math.PI/N;
  let t=Date.now()-3600e3,ang=0;const pts=[];
  for(let i=0;i<=N;i++){
    const jit=fake?1:.7+Math.random()*.6;
    if(i>0){ang+=base*jit;t+=R*base*jit/v*(fake?1:.8+Math.random()*.4)*1000}
    const nz=fake?0:2;
    let lat=la+(R*Math.sin(ang)+(Math.random()-.5)*nz)/111320,lng=lo+(R*Math.cos(ang)+(Math.random()-.5)*nz)/(111320*cs);
    if(kind==='tele'&&i>=N/2){lat+=.02;if(i===Math.floor(N/2))t-=(R*base/v*1000)-3000}
    pts.push([lat,lng,t,fake?5:4+Math.random()*8,0]);
  }
  return pts;
}
function runScenario(k){
  const res=analyzeTrack(genTrack(k),{bad:k==='car'?6:0});
  res.label='Prueba: '+SCEN.find(x=>x[0]===k)[1];
  openFair(res);
}
function openFair(res){
  const me=DB.session,st=getStats(me),tr=trustOf(st),lock=(st.lockUntil||0)-Date.now();
  let h='<h2>🛡️ Juego limpio</h2><div style="margin:6px 0 12px"><b>Confianza: '+tr+'%</b><div class="bar"><i style="width:'+tr+'%;background:'+(tr>=70?'var(--acc)':tr>=40?'#d97706':'#dc2626')+'"></i></div><small class="mut">Baja con lazos rechazados o sospechosos y sube de a poco con caminatas limpias. Por debajo de 40% la cuenta queda en revisión 24 h.</small></div>';
  if(lock>0)h+='<div class="flag reject">Cuenta en revisión: podés volver a conquistar en '+fmtDur(lock)+'.</div>';
  if(res){
    h+='<h3>'+esc(res.label||'Resultado')+'</h3>';
    h+='<div class="flag '+(res.reject?'reject':res.warn?'warn':'ok')+'"><b>'+(res.reject?'🚫 Rechazado':res.warn?'⚠️ Con advertencias':'✅ Válido')+'</b><br><small>'+fmtDist(res.stats.dist)+' en '+fmtDur(res.stats.dur*1000)+' · media '+nf(res.stats.avg*3.6,1)+' km/h · máx. '+nf(res.stats.max*3.6,1)+' km/h</small></div>';
    h+=res.flags.map(f=>'<div class="flag '+f.sev+'">'+(f.sev==='reject'?'🚫':'⚠️')+' '+esc(f.msg)+'</div>').join('');
  }
  h+='<h3>Qué verificamos</h3><div class="rules"><p>🚗 <b>Velocidad:</b> media y tramos sostenidos. Caminar y trotar valen; bici, moto y auto no.</p><p>📡 <b>Saltos:</b> teletransportes de ubicación.</p><p>🤖 <b>GPS simulado:</b> rutas demasiado perfectas, precisión que nunca varía, hora desfasada.</p><p>🗺️ <b>Tamaño:</b> lazos imposibles para una caminata (más de '+fmtArea(AC.MAX_LOOP_M2)+').</p><p class="mut">En la app nativa se suma la detección de ubicación falsa del sistema (Android <i>isMock</i>, iOS <i>simulatedBySoftware</i>), podómetro, Play Integrity / App Attest y revisión en el servidor. Estos controles de la web son solo una primera capa.</p></div>';
  h+='<h3>Probar el detector</h3><div class="menu">'+SCEN.map(x=>'<button data-a="ac" data-k="'+x[0]+'">'+x[1]+'</button>').join('')+'</div>';
  sheet(h);
}

const skinOf=u=>(DB.users[u]||{}).skin||{};
const skinItem=(u,t)=>{const id=skinOf(u)[t];return id?SHOP.find(x=>x.id===id)||null:null};

  const c=colorOf(me);
  if(it.t==='color')return 'background:'+it.v;

function buy(id){

function nearPath(s,path){
  const la0=s.c[0],lo0=s.c[1],cs=Math.cos(la0*Math.PI/180);
  const P=path.concat([path[0]]).map(p=>[(p[1]-lo0)*111320*cs,(p[0]-la0)*111320]);
  for(let i=0;i<P.length;i++){
    const a=P[i],b=P[i+1]||P[i],dx=b[0]-a[0],dy=b[1]-a[1],L2=dx*dx+dy*dy;
    let t=L2?(-a[0]*dx-a[1]*dy)/L2:0;t=Math.max(0,Math.min(1,t));
    const x=a[0]+t*dx,y=a[1]+t*dy;
    if(x*x+y*y<=s.r*s.r)return true;
  }
  return false;
}
function grantCoupons(path){
  const me=DB.session,out=[],now=Date.now(),A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  SHOPS.forEach(s=>{
    if(!nearPath(s,path))return;
    const key=me+'|'+s.id;
    if(now-(DB.visits[key]||0)<COUPON_COOLDOWN)return;
    DB.visits[key]=now;
    let code='';for(let i=0;i<6;i++)code+=A[Math.random()*A.length|0];
    (DB.coupons[me]=DB.coupons[me]||[]).unshift({id:s.id+'-'+now.toString(36),shop:s.id,code,ts:now,exp:now+COUPON_VALID,used:false});
    const st=getStats(me);st.coins=(st.coins||0)+25;
    queueCel(s.e+' ¡Cupón de '+s.n+'!',s.offer+' · +25 🪙',false);
    out.push(s);
  });
  return out;
}
function useCoupon(id){
  const c=(DB.coupons[DB.session]||[]).find(x=>x.id===id);
  if(c&&!c.used&&c.exp>=Date.now()){c.used=true;save();toast('✅ Cupón marcado como usado')}
  openCoupons();
}
function openCoupons(){
  const me=DB.session,L=DB.coupons[me]||[],now=Date.now();

  }).join(''):'<p class="mut">Todavía no tenés cupones.</p>';
  h+='<h3>Comercios aliados</h3>'+SHOPS.map(s=>{
    const cd=COUPON_COOLDOWN-(now-(DB.visits[me+'|'+s.id]||0));
    return '<div class="ppl"><div class="n"><b>'+s.e+' '+esc(s.n)+'</b><br><small class="mut">'+esc(s.offer)+'</small></div><small class="mut">'+(cd>0?'Disponible en '+fmtDur(cd):'Disponible ✅')+'</small></div>';
  }).join('');
  h+='<div style="margin-top:10px">'+btn('shops','📍 Ver comercios en el mapa')+'</div>';
  sheet(h);
}
